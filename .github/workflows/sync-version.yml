# 同步版本号：主仓库发新版时更新 public/version.txt，触发 Cloudflare Pages 重新构建。
# 触发方式：
#   - 主仓库 release 后发 repository_dispatch（主仓库配置了 SITE_DEPLOY_TOKEN 时，即时）
#   - 每天定时检查（兜底，与 sync-installers 同模式）
#   - 手动运行（Actions → Run workflow，可显式填版本号）
# 有变化才提交，Cloudflare Pages 检测到推送自动重新部署。
name: 同步版本号

on:
  workflow_dispatch:
    inputs:
      version:
        description: '显式指定版本号（留空则读主仓库最新）'
        required: false
        type: string
  repository_dispatch:
    types: [sync-version]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解析最新版本号
        id: resolve
        run: |
          if [ -n "${{ github.event.client_payload.version }}" ]; then
            VER="${{ github.event.client_payload.version }}"
          elif [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER=$(curl -fsSL https://raw.githubusercontent.com/tenngoxars/Kuraya/main/kuraya/__init__.py | sed -n "s/.*__version__ *= *['\"]\([^'\"]*\)['\"].*/\1/p" | head -1)
          fi
          if [ -z "$VER" ]; then
            echo "无法解析版本号"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: 有变化才提交
        run: |
          VER="${{ steps.resolve.outputs.version }}"
          if [ "$(cat public/version.txt)" = "$VER" ]; then
            echo "版本无变化（$VER），跳过"
          else
            echo "$VER" > public/version.txt
            git config user.name "github-actions[bot]"
            git config user.email "actions@github.com"
            git add public/version.txt
            git commit -m "同步版本号 v$VER"
            git push
          fi
